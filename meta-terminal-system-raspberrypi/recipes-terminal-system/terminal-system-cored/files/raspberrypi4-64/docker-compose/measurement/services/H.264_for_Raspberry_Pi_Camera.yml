image: $BASE_URI/$IMAGE_NAME_DEVICE_CONNECTOR:$IMAGE_TAG_DEVICE_CONNECTOR
restart: unless-stopped
privileged: true
depends_on:
    intdash-edge-agent2:
        condition: service_healthy
volumes:
  - /var/run/core/intdash:/var/run/intdash
  - /dev:/dev
  - /run/udev:/run/udev:ro # libcamerasrc needs udev https://github.com/raspberrypi/rpicam-apps/issues/270
command:
    - --config
    - "/etc/dc_conf/gstreamer_h264.yml"
environment:
    # declare all input properties (framerate, colorimetry, interlace-mode) https://forums.raspberrypi.com/viewtopic.php?p=2081618&sid=693620c6e51d7a938b02745082f64e05#p2081618
    DC_PROCESS_SRC_CONF_COMMAND: gst-launch-1.0 -q libcamerasrc ! videorate ! video/x-raw,width=${DC_WIDTH},height=${DC_HEIGHT},framerate=${DC_FPS}/1,format=YUY2,colorimetry=bt709,interlace-mode=progressive ! videoflip video-direction=${DC_VIDEOFLIP} ! v4l2h264enc extra-controls='controls,video_bitrate=${DC_BITRATE},h264_i_frame_period=${DC_FPS}' ! 'video/x-h264,profile=main,level=(string)4,stream-format=byte-stream' ! queue ! h264parse ! queue ! fdsink fd=1
    DC_H264_SPLIT_FILTER_CONF_DELAY_MS: 100
    DC_H264_SPLIT_FILTER_CONF_FORMAT: ${DC_ISCPV2COMPAT_FORMAT}
    DC_PRINT_LOG_FILTER_CONF_TAG: ${DC_TAG}
    DC_FILE_SINK_CONF_PATH: ${DC_UPSTREAM_FIFO_0}

substitution_variables:
    - key: DC_UPSTREAM_FIFO_0
      default: ''
      validation: '^/var/run/intdash/'
      display_strings_i18n:
        - locale: und
          name: FIFO Path
          description: intdash Edge Agent 2へデータを送信するためのFIFOのパス
    - key: DC_TAG
      default: 'h264_RPi'
      display_strings_i18n:
        - locale: und
          name: Tag
          description: このデバイスコネクターのログメッセージに付与するタグ
    - key: DC_WIDTH
      default: '1280'
      options: ['1280', '1920']
      display_strings_i18n:
        - locale: und
          name: Width
          description: 動画の幅
          unit: pixel
    - key: DC_HEIGHT
      default: '720'
      options: ['720', '1080']
      display_strings_i18n:
        - locale: und
          name: Height
          description: 動画の高さ
          unit: pixel
    - key: DC_FPS
      default: '15'
      options: ['5', '10', '15', '30']
      display_strings_i18n:
        - locale: und
          name: Frame Rate
          description: フレームレート
          unit: fps
    - key: DC_VIDEOFLIP
      default: 'identity'
      options: ['identity', '180', '90r', '90l', 'horiz', 'vert']
      display_strings_i18n:
        - locale: und
          name: Video Flip
          description: 回転・反転
    - key: DC_BITRATE
      default: '2000000'
      options: ['500000', '1000000', '2000000', '3000000', '5000000', '8000000']
      display_strings_i18n:
        - locale: und
          name: Bitrate
          description: ビットレート
          unit: bps
    - key: DC_ISCPV2COMPAT_FORMAT
      default: 'iscp_v2_compat'
      options: ['iscp_v2_compat', 'iscp_v2_compat_byte_stream']
      display_strings_i18n:
        - locale: und
          name: iscp-v2-compat Format
          description: '送信時のデータ型（特別な理由がなければiscp_v2_compatを使用してください）'
