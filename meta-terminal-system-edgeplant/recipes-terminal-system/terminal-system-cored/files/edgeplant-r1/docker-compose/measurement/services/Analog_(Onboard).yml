image: $BASE_URI/$IMAGE_NAME_DEVICE_CONNECTOR:$IMAGE_TAG_DEVICE_CONNECTOR
restart: unless-stopped
privileged: true
depends_on:
    intdash-edge-agent2:
        condition: service_healthy
volumes:
  - /var/run/core/intdash:/var/run/intdash
  - /dev:/dev
command:
    - --config
    - "/etc/dc_conf/iio_upstream.yml"
environment:
    DC_FILE_SINK_CONF_PATH: ${DC_UPSTREAM_FIFO_0}
    DC_PRINT_LOG_FILTER_CONF_TAG: ${DC_TAG}
    DC_BEFORE_SCRIPT: |
      [
        'if [ ! -d /config ];then mkdir /config; fi',
        'if ! grep -qs "none /config configfs" /proc/mounts;then mount -t configfs none /config; fi',
        'if [ ! -d /config/iio/triggers/hrtimer/ad7994_timer_trigger ];then mkdir /config/iio/triggers/hrtimer/ad7994_timer_trigger; fi'
      ]
    DC_IIO_SRC_CONF_TIMESTAMP_MODE: device
    DC_IIO_SRC_CONF_CONTEXT: '"local:"'
    DC_IIO_SRC_CONF_DEVICE_NAME: ad7994
    DC_IIO_SRC_CONF_TRIGGER_NAME: ad7994_timer_trigger
    DC_IIO_SRC_CONF_SCAN_ELEMENTS: '[{name: voltage0}, {name: voltage1}, {name: voltage2}, {name: voltage3}]'
    DC_IIO_SRC_CONF_APPLY_SCALE: true
    DC_IIO_SRC_CONF_ADDITIONAL_SCALE_FACTOR: 11.989010989
    DC_IIO_SRC_CONF_SAMPLING_FREQUENCY: '"${DC_SAMPLING_FREQUENCY}"'
    DC_IIO_SRC_CONF_SEND_FREQUENCY: 5
    DC_IIO_SRC_CONF_TIMEOUT_MS: 2000

substitution_variables:
    - key: DC_UPSTREAM_FIFO_0
      default: ''
      validation: '^/var/run/intdash/'
      display_strings_i18n:
        - locale: und
          name: FIFO Path
          description: intdash Edge Agent 2へデータを送信するためのFIFOのパス
    - key: DC_TAG
      default: 'analog(onboard)'
      display_strings_i18n:
        - locale: und
          name: Tag
          description: このデバイスコネクターのログメッセージに付与するタグ
    - key: DC_SAMPLING_FREQUENCY
      default: 1000
      validation: '^([1-9][0-9]{0,2}|1000)$'
      display_strings_i18n:
        - locale: und
          name: Sampling Frequency
          description: サンプリング周波数
          unit: Hz
