# The state directory ships as 0700 but the bind mount from /data exposes a
# source directory systemd created as 0755. Restore 0700 so connection history
# (timestamps, seen-bssids) stays unreadable to non-root users; NetworkManager
# does not fix the mode itself the way dhcpcd and docker do for their bind mounts.
d /var/lib/NetworkManager 0700 root root -
