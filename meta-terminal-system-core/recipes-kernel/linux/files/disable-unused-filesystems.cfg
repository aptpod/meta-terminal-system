# Filesystems the product never uses. The base defconfigs enable them, which
# keeps their kernel code reachable from inserted media (automount, udev's
# btrfs device scan) and from any mount request.
# Only filesystems whose removal changes nothing else in the resulting .config
# are listed; ocfs2 (selects QUOTA), ubifs (selects CRYPTO_ZSTD) and f2fs
# (selects CRYPTO_CRC32 on 6.6) stay. btrfs is the exception: it is the one
# udev reaches without a mount, and what goes with it (CRYPTO_XXHASH,
# CRYPTO_BLAKE2B, ...) has no other user.
# CONFIG_BTRFS_FS is not set
# CONFIG_GFS2_FS is not set
# CONFIG_XFS_FS is not set
# CONFIG_JFS_FS is not set
# CONFIG_HFS_FS is not set
# CONFIG_HFSPLUS_FS is not set
# CONFIG_NILFS2_FS is not set
# CONFIG_NTFS_FS is not set
# CONFIG_NTFS3_FS is not set
# CONFIG_EROFS_FS is not set
# CONFIG_JFFS2_FS is not set
# CONFIG_ROMFS_FS is not set
