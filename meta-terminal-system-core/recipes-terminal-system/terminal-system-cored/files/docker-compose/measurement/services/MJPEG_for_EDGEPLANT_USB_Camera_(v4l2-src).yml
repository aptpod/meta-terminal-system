image: $BASE_URI/$IMAGE_NAME_DEVICE_CONNECTOR:$IMAGE_TAG_DEVICE_CONNECTOR
restart: unless-stopped
privileged: true
depends_on:
    intdash-edge-agent2:
        condition: service_healthy
volumes:
  - /var/run/core/intdash:/var/run/intdash
  - /dev:/dev
command:
    - --config
    - "/etc/dc_conf/jpeg.yml"
environment:
    DC_V4L2_SRC_CONF_PATH: ${DC_DEVICE_PATH}
    DC_V4L2_SRC_WIDTH: ${DC_WIDTH}
    DC_V4L2_SRC_HEIGHT: ${DC_HEIGHT}
    DC_V4L2_SRC_FPS: 30
    DC_PRINT_LOG_FILTER_CONF_TAG: ${DC_TAG}
    DC_FILE_SINK_CONF_PATH: ${DC_UPSTREAM_FIFO_0}

substitution_variables:
    - key: DC_UPSTREAM_FIFO_0
      default: ''
      validation: '^/var/run/intdash/'
      display_strings_i18n:
        - locale: und
          name: FIFO Path
          description: intdash Edge Agent 2へデータを送信するためのFIFOのパス
    - key: DC_TAG
      default: 'mjpeg(v4l2-src)'
      display_strings_i18n:
        - locale: und
          name: Tag
          description: このデバイスコネクターのログメッセージに付与するタグ
    - key: DC_DEVICE_PATH
      default: '/dev/video0'
      options_script: "/etc/core/docker-compose/measurement/services/Camera/device_path_edgeplant_usb_camera.sh"
      cache_key_command: "echo -n edgeplant-usb-camera-device-path-$(ls -al /dev/v4l/by-id/* | md5sum -z)"
      display_strings_i18n:
        - locale: und
          name: Device Path
          description: カメラのデバイスパス
    - key: DC_WIDTH
      default: '640'
      options: ['640']
      display_strings_i18n:
        - locale: und
          name: Width
          description: 動画の幅
          unit: pixel
    - key: DC_HEIGHT
      default: '480'
      options: ['480']
      display_strings_i18n:
        - locale: und
          name: Height
          description: 動画の高さ
          unit: pixel
