# gpsd ships no Restart=, so an OOM kill leaves the device without GPS and
# without NMEA time sync until someone reboots it.
#
# on-failure, not always: gpsd.service skips itself through ExecCondition when
# GPS time sync is disabled, and systemd before v251 (kirkstone ships 250)
# restarts even a skipped unit under Restart=always, spinning it every
# RestartSec forever. StartLimitIntervalSec=0 keeps systemd from giving up on
# the restarts instead; these devices run unattended, with nobody on site to
# start the unit again.
[Unit]
StartLimitIntervalSec=0

[Service]
Restart=on-failure
RestartSec=5
