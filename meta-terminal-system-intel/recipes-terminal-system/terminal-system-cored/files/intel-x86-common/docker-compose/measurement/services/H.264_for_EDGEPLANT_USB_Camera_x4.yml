image: $BASE_URI/$IMAGE_NAME_DEVICE_CONNECTOR:$IMAGE_TAG_DEVICE_CONNECTOR
restart: unless-stopped
privileged: true
depends_on:
    intdash-edge-agent2:
        condition: service_healthy
volumes:
  - /var/run/core/intdash:/var/run/intdash
  - /dev:/dev
command:
    - --config
    - "/etc/dc_conf/gstreamer_h264.yml"
environment:
    DC_PROCESS_SRC_CONF_COMMAND: gst-launch-1.0 -q compositor start-time-selection=1 background=1 latency=1000000000 name=mix sink_0::xpos=0 sink_0::ypos=0 sink_0::alpha=1 sink_0::zorder=0 sink_1::xpos=640 sink_1::ypos=0 sink_1::alpha=1 sink_1::zorder=1 sink_2::xpos=0 sink_2::ypos=480 sink_2::alpha=1 sink_2::zorder=2 sink_3::xpos=640 sink_3::ypos=480 sink_3::alpha=1 sink_3::zorder=3 ! queue ! vaapih264enc rate-control=2 bitrate=${DC_BITRATE} max-bframes=0 keyframe-period=${DC_FPS} ! video/x-h264,stream-format=byte-stream ! queue ! h264parse ! fdsink fd=1 v4l2src device=${DC_DEVICE_PATH_1} ! queue ! videorate ! image/jpeg,width=640,height=480,framerate=${DC_FPS}/1 ! vaapijpegdec ! queue ! vaapipostproc video-direction=${DC_VIDEOFLIP_1} ! mix.sink_0 v4l2src device=${DC_DEVICE_PATH_2} ! queue ! videorate ! image/jpeg,width=640,height=480,framerate=${DC_FPS}/1 ! vaapijpegdec ! queue ! vaapipostproc video-direction=${DC_VIDEOFLIP_2} ! mix.sink_1 v4l2src device=${DC_DEVICE_PATH_3} ! queue ! videorate ! image/jpeg,width=640,height=480,framerate=${DC_FPS}/1 ! vaapijpegdec ! queue ! vaapipostproc video-direction=${DC_VIDEOFLIP_3} ! mix.sink_2 v4l2src device=${DC_DEVICE_PATH_4} ! queue ! videorate ! image/jpeg,width=640,height=480,framerate=${DC_FPS}/1 ! vaapijpegdec ! queue ! vaapipostproc video-direction=${DC_VIDEOFLIP_4} ! mix.sink_3
    DC_H264_SPLIT_FILTER_CONF_DELAY_MS: 100
    DC_H264_SPLIT_FILTER_CONF_FORMAT: ${DC_ISCPV2COMPAT_FORMAT}
    DC_PRINT_LOG_FILTER_CONF_TAG: ${DC_TAG}
    DC_FILE_SINK_CONF_PATH: ${DC_UPSTREAM_FIFO_0}

substitution_variables:
    - key: DC_UPSTREAM_FIFO_0
      default: ''
      validation: '^/var/run/intdash/'
      display_strings_i18n:
        - locale: und
          name: FIFO Path
          description: intdash Edge Agent 2へデータを送信するためのFIFOのパス
    - key: DC_TAG
      default: 'h264(x4)'
      display_strings_i18n:
        - locale: und
          name: Tag
          description: このデバイスコネクターのログメッセージに付与するタグ
    - key: DC_DEVICE_PATH_1
      default: '/dev/video0'
      options_script: "/etc/core/docker-compose/measurement/services/Camera/device_path_edgeplant_usb_camera.sh"
      cache_key_command: "echo -n edgeplant-usb-camera-device-path-1-$(ls -al /dev/v4l/by-id/* | md5sum -z)"
      display_strings_i18n:
        - locale: und
          name: Device Path for Upper Left
          description: 左上の動画を取得するカメラのデバイスパス
    - key: DC_DEVICE_PATH_2
      default: '/dev/video2'
      options_script: "/etc/core/docker-compose/measurement/services/Camera/device_path_edgeplant_usb_camera.sh"
      cache_key_command: "echo -n edgeplant-usb-camera-device-path-2-$(ls -al /dev/v4l/by-id/* | md5sum -z)"
      display_strings_i18n:
        - locale: und
          name: Device Path for Upper Right
          description: 右上の動画を取得するカメラのデバイスパス
    - key: DC_DEVICE_PATH_3
      default: '/dev/video4'
      options_script: "/etc/core/docker-compose/measurement/services/Camera/device_path_edgeplant_usb_camera.sh"
      cache_key_command: "echo -n edgeplant-usb-camera-device-path-3-$(ls -al /dev/v4l/by-id/* | md5sum -z)"
      display_strings_i18n:
        - locale: und
          name: Device Path for Lower Left
          description: 左下の動画を取得するカメラのデバイスパス
    - key: DC_DEVICE_PATH_4
      default: '/dev/video6'
      options_script: "/etc/core/docker-compose/measurement/services/Camera/device_path_edgeplant_usb_camera.sh"
      cache_key_command: "echo -n edgeplant-usb-camera-device-path-4-$(ls -al /dev/v4l/by-id/* | md5sum -z)"
      display_strings_i18n:
        - locale: und
          name: Device Path for Lower Right
          description: 右下の動画を取得するカメラのデバイスパス
    - key: DC_FPS
      default: '15'
      options: ['15']
      display_strings_i18n:
        - locale: und
          name: Frame Rate
          description: フレームレート
          unit: fps
    - key: DC_VIDEOFLIP_1
      default: 'identity'
      options: ['identity', '180', '90r', '90l', 'horiz', 'vert']
      display_strings_i18n:
        - locale: und
          name: Video Flip for Upper Left
          description: 左上の動画の回転・反転
    - key: DC_VIDEOFLIP_2
      default: 'identity'
      options: ['identity', '180', '90r', '90l', 'horiz', 'vert']
      display_strings_i18n:
        - locale: und
          name: Video Flip for Upper Right
          description: 右上の動画の回転・反転
    - key: DC_VIDEOFLIP_3
      default: 'identity'
      options: ['identity', '180', '90r', '90l', 'horiz', 'vert']
      display_strings_i18n:
        - locale: und
          name: Video Flip for Lower Left
          description: 左下の動画の回転・反転
    - key: DC_VIDEOFLIP_4
      default: 'identity'
      options: ['identity', '180', '90r', '90l', 'horiz', 'vert']
      display_strings_i18n:
        - locale: und
          name: Video Flip for Lower Right
          description: 右下の動画の回転・反転
    - key: DC_BITRATE
      default: '2000'
      options: ['500', '1000', '2000', '3000', '5000', '8000']
      display_strings_i18n:
        - locale: und
          name: Bitrate
          description: ビットレート
          unit: Kbps
    - key: DC_ISCPV2COMPAT_FORMAT
      default: 'iscp_v2_compat'
      options: ['iscp_v2_compat', 'iscp_v2_compat_byte_stream']
      display_strings_i18n:
        - locale: und
          name: iscp-v2-compat Format
          description: '送信時のデータ型（特別な理由がなければiscp_v2_compatを使用してください）'
